# #6.8-grafana-dashboards
# Tells Grafana to load every dashboard JSON mounted at /var/lib/grafana/dashboards.
# Because they are provisioned from files, the dashboards are version-controlled and
# recreated on a fresh stack — nothing has to be rebuilt by hand.
apiVersion: 1

providers:
  - name: 'Inventory'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
