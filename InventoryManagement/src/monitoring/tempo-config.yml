# #6.10-tempo-config
# Trace store, queried by Grafana on :3200 and receiving OTLP from Alloy on 4317/4318.
# Local filesystem blocks with 1h retention — enough to demo distributed tracing
# (request → EF Core SQL → outbound HTTP) without needing object storage.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
