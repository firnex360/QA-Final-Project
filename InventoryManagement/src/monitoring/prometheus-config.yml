# #6.4-prometheus-config
# Metrics store. Listens on :3300 (not the default 9090 — see docker-compose).
# Receives everything by remote-write from Alloy and evaluates the alert rules,
# forwarding anything that fires to Alertmanager.
global:
  scrape_interval: 15s

# Alert rules evaluated on every scrape interval.
rule_files:
  - /etc/prometheus/alert-rules.yml

# Send firing alerts to Alertmanager (compose service name).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs: []
